services:
  - type: web
    name: eco-abidjan-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PASSWORD
        sync: false
      - key: SNOWFLAKE_PRIVATE_KEY_PATH
        sync: false
      - key: SNOWFLAKE_PRIVATE_KEY_PASSPHRASE
        sync: false
      - key: SNOWFLAKE_TOKEN
        sync: false
      - key: SNOWFLAKE_HOST
        sync: false
      - key: SNOWFLAKE_ROLE
        value: ACCOUNTADMIN
      - key: SNOWFLAKE_WAREHOUSE
        value: COMPUTE_WH
      - key: SNOWFLAKE_DATABASE
        value: ECOABIDJAN
      - key: SNOWFLAKE_SCHEMA
        value: CORE
